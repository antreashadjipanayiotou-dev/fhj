name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "ZIP extracted successfully."

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find android_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."

            echo "Files inside ZIP:"
            find android_project -type f

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "BUILDING ANDROID APK"
          echo "================================"

          gradle \
            --no-daemon \
            --no-parallel \
            --max-workers=1 \
            :app:assembleDebug \
            --stacktrace \
            --console=plain

      - name: Search APK
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "SEARCHING FOR APK"
          echo "================================"

          APK_FILE=$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK NOT FOUND."

            echo ""
            echo "APK files found:"
            find "$GITHUB_WORKSPACE" -type f -name '*.apk' || true

            echo ""
            echo "Android project files:"
            find android_project -type f | sort

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/artifact_apk"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/artifact_apk/AndreasHadjiApp-debug.apk"

          echo ""
          echo "APK READY FOR UPLOAD:"
          ls -lh "$GITHUB_WORKSPACE/artifact_apk/AndreasHadjiApp-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/artifact_apk/AndreasHadjiApp-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK does not exist."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          echo "APK SIZE: $SIZE bytes"

          if [ "$SIZE" -le 10000 ]; then
            echo "ERROR: APK file is too small."
            exit 1
          fi

          echo "APK VERIFIED SUCCESSFULLY."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndreasHadjiApp-APK
          path: artifact_apk/AndreasHadjiApp-debug.apk
          if-no-files-found: error
          retention-days: 30
          overwrite: true
